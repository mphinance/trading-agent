# Allow list of environment variable NAMES. Never values.
# Source: AUTODETECTION.md sections 5.1, 5.2, 5.3 (broker pages, last_verified 2026-11-11).
# reusable: "reference-only" for refresh tokens, passwords, PINs, private keys and
# wallet keys (never offered for copy). "copy-with-consent" for API-key style names.
specs:
  # ---- AI keys (AUTODETECTION.md section 4, rank 3) ----
  # UNVERIFIED: conventional names, not yet confirmed against each provider's docs.
  - {finding_prefix: env, kind: ai-key, what: OpenRouter API key, names: [OPENROUTER_API_KEY], reusable: copy-with-consent}  # UNVERIFIED
  - {finding_prefix: env, kind: ai-key, what: Venice API key, names: [VENICE_API_KEY], reusable: copy-with-consent}  # UNVERIFIED
  - {finding_prefix: env, kind: ai-key, what: OpenAI API key, names: [OPENAI_API_KEY], reusable: copy-with-consent}  # UNVERIFIED
  - {finding_prefix: env, kind: ai-key, what: Anthropic API key, names: [ANTHROPIC_API_KEY], reusable: copy-with-consent}  # UNVERIFIED

  # ---- Broker credentials (AUTODETECTION.md section 5.1) ----
  - {finding_prefix: env, kind: broker-key, what: Alpaca API credentials, names: [ALPACA_API_KEY, ALPACA_SECRET_KEY], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: Bitget API credentials, names: [BITGET_API_KEY, BITGET_SECRET_KEY, BITGET_PASSPHRASE], reusable: copy-with-consent}
  # BingX: the page names a secret but not its variable. UNVERIFIED.
  - {finding_prefix: env, kind: broker-key, what: BingX API key, names: [BINGX_API_KEY], reusable: copy-with-consent}
  # Bybit: key id name not stated on the page. UNVERIFIED.
  - {finding_prefix: env, kind: broker-key, what: Bybit API secret, names: [BYBIT_API_SECRET], reusable: copy-with-consent}
  # _PATH variables point at a key file. Existence only, never opened, never copied.
  - {finding_prefix: env, kind: broker-key, what: Bybit private key path, names: [BYBIT_API_PRIVATE_KEY_PATH], reusable: reference-only}
  - {finding_prefix: env, kind: broker-key, what: Capital.com API credentials, names: [CAP_API_KEY, CAP_IDENTIFIER], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: Capital.com API password, names: [CAP_API_PASSWORD], reusable: reference-only}
  # Collides in name with Google's Gemini AI. Scope to the broker step only.
  - {finding_prefix: env, kind: broker-key, what: Gemini exchange API credentials, names: [GEMINI_API_KEY, GEMINI_API_SECRET], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: HTX API credentials, names: [HTX_API_KEY, HTX_SECRET_KEY], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: Kalshi API key, names: [KALSHI_API_KEY], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: Kalshi private key path, names: [KALSHI_PRIVATE_KEY_PATH], reusable: reference-only}
  - {finding_prefix: env, kind: broker-key, what: Korea Investment & Securities app credentials, names: [KIS_APP_KEY, KIS_APP_SECRET, KIS_PAPER_APP_KEY, KIS_PAPER_APP_SECRET], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: Luno API credentials, names: [LUNO_API_KEY_ID, LUNO_API_SECRET], reusable: copy-with-consent}
  # Wallet private key: highest risk name in the list. Never offered for copy.
  - {finding_prefix: env, kind: broker-key, what: Polymarket wallet private key, names: [POLYMARKET_PRIVATE_KEY], reusable: reference-only}
  - {finding_prefix: env, kind: broker-key, what: Public.com credentials, names: [PUBLIC_COM_SECRET, PUBLIC_COM_ACCOUNT_ID], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: tastytrade client credentials, names: [TASTYTRADE_CLIENT_ID, TASTYTRADE_CLIENT_SECRET], reusable: copy-with-consent}
  # Refresh token is a long-lived secret.
  - {finding_prefix: env, kind: broker-key, what: tastytrade refresh token, names: [TASTYTRADE_REFRESH_TOKEN], reusable: reference-only}
  - {finding_prefix: env, kind: broker-key, what: Tiger Brokers credentials, names: [TIGEROPEN_TIGER_ID, TIGEROPEN_ACCOUNT, TIGEROPEN_SECRET_KEY], reusable: copy-with-consent}
  # Private key material and the 2FA token (HK/institutional): reference-only.
  - {finding_prefix: env, kind: broker-key, what: Tiger Brokers private key and 2FA token, names: [TIGEROPEN_PRIVATE_KEY, TIGEROPEN_TOKEN], reusable: reference-only}
  # Phone number and PIN, not an API key.
  - {finding_prefix: env, kind: broker-key, what: Trade Republic phone and PIN, names: [TR_PHONE_NUMBER, TR_PIN], reusable: reference-only}
  # Account password and TOTP secret.
  - {finding_prefix: env, kind: broker-key, what: DEGIRO account login, names: [DEGIRO_USERNAME, DEGIRO_PASSWORD, DEGIRO_TOTP_SECRET], reusable: reference-only}
  - {finding_prefix: env, kind: broker-key, what: Deriv API token, names: [DERIV_API_TOKEN], reusable: copy-with-consent}
  # Angel One: client code, password, TOTP secret names not stated. UNVERIFIED.
  - {finding_prefix: env, kind: broker-key, what: Angel One API key, names: [ANGEL_ONE_API_KEY], reusable: copy-with-consent}
  - {finding_prefix: env, kind: broker-key, what: XBTFX API key, names: [XBTFX_API_KEY], reusable: copy-with-consent}
  # Trade password.
  - {finding_prefix: env, kind: broker-key, what: Moomoo trade login, names: [MOOMOO_TRADE_PASSWORD, MOOMOO_SECURITY_FIRM], reusable: reference-only}

  # ---- Data keys (AUTODETECTION.md section 5.3) ----
  # Ships empty: the doc says vendor names are UNVERIFIED until read from each
  # vendor's own docs. The manual "paste a key" path always works.

# AUTODETECTION.md section 5.2: the broker connectors' own switches. Information
# only. Never detected as findings, never copied, never set.
info_names:
  - ALPACA_PAPER_TRADE
  - IBKR_IS_PAPER
  - TASTYTRADE_READ_ONLY
  - TIGERMCP_READONLY
  - SAXO_TRADING
  - CAP_ENV
