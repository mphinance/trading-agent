name: CI

# Everything here runs without credentials, a network, or a Webull account.
# The tests stub the broker; nothing in this workflow can place an order or read
# a real position, and no secret is available to it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the range the docs claim. 3.10 is what venus's existing
      # venv runs; 3.14 is the newly-supported top end (SDK 2.0.16 declares
      # python_requires='>=3.8,<3.15'), and it is the one most likely to break
      # first on a cryptography or grpcio wheel.
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Unpinned on purpose (see requirements.txt) — so this step is also
          # the canary for an upstream break, which is the point of running it
          # on a schedule-free trigger rather than pinning it away.
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Lint (errors only, not style)
        run: |
          pip install ruff
          # E9 syntax errors, F63/F7 broken constructs, F82 undefined names.
          # Deliberately not a style gate: this repo has no formatter config and
          # a noisy lint would just get ignored.
          ruff check --select=E9,F63,F7,F82 .

      - name: Order path
        run: python test_orders.py

      - name: Alert crossing logic
        run: python test_alerts.py

      # Imports server.py and mcp_server.py and enumerates both surfaces, so it
      # fails if a module cannot even load. That is not hypothetical: a merged
      # mcp_server.py once imported a class the mcp SDK does not export, and the
      # server could not start at all.
      - name: API docs match the code
        run: python test_docs.py

      - name: Smoke — the app builds its route table
        run: |
          python - <<'PY'
          import os, tempfile
          os.environ["SIDECAR_STATE_DIR"] = tempfile.mkdtemp()
          import server
          routes = [r for r in server.app.routes if hasattr(r, "methods")]
          assert len(routes) > 30, f"only {len(routes)} routes registered"
          print(f"ok: {len(routes)} routes")
          PY

      - name: Smoke — MCP server exposes its tools over the real registry
        run: |
          python - <<'PY'
          import asyncio, os, tempfile
          os.environ["SIDECAR_STATE_DIR"] = tempfile.mkdtemp()
          import mcp_server
          tools = asyncio.run(mcp_server.mcp.list_tools())
          names = {t.name for t in tools}
          # The order path and the alert path must both be present: they came
          # from different branches and a bad merge silently drops one.
          for required in ("preview_order", "place_order", "cancel_order",
                           "get_portfolio", "get_gamma", "create_alert"):
              assert required in names, f"missing MCP tool: {required}"
          print(f"ok: {len(names)} tools")
          PY

  secrets:
    # Cheap backstop for rule 2 and rule 5: no credential should ever reach a
    # commit, and this panel gets streamed on video.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credential-shaped strings in tracked files
        run: |
          # Real keys, not the truncated placeholders the docs use to show shape.
          if git grep -nIE '(sk-ant-[A-Za-z0-9_-]{20,}|td_live_[A-Za-z0-9_-]{20,})' -- . ; then
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "clean"

      - name: Credential files are not tracked
        run: |
          # .env* and the SDK's 2FA token dir are gitignored; prove it stayed
          # that way rather than trusting the ignore file.
          bad=$(git ls-files | grep -E '(^|/)(\.env|conf/token\.txt|token\.txt)' || true)
          if [ -n "$bad" ]; then
            echo "::error::credential file is tracked: $bad"
            exit 1
          fi
          echo "clean"
