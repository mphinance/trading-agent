name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The deployable range. This comment used to say the SDK pins <3.14 —
        # that was true of an older SDK. 2.0.16 declares
        # python_requires='>=3.8,<3.15' with explicit cryptography/grpcio pins
        # for 3.14, so 3.14 is supported and is the end most likely to break
        # first. venus runs 3.10. Testing both ends catches stdlib drift in
        # between; the SDK itself is stubbed here, so this is about THIS code.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately NOT requirements.txt. Two of its entries are stubbed in
        # tests/conftest.py and installing them would make CI about them rather
        # than about this code:
        #   webull-openapi-python-sdk  pulls paho-mqtt, which needs a compiler
        #                              on some Pythons and pins python <3.14
        #   claude-agent-sdk           shells out to a `claude` binary that only
        #                              ships via npm, so importing proves nothing
        # Everything the suite exercises is reachable without either.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Byte-compile every module
        # Catches a syntax error in a file no test imports (wb.py is stubbed
        # away from the suite's import graph).
        run: python -m compileall -q .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree for credential-shaped strings
        # Rule 2 keeps secrets in the parent directory so they cannot be
        # committed by construction, and rule 5 assumes everything here ends up
        # on video. This is the backstop for a paste that slipped through.
        # Placeholders in docs (sk-ant-..., 123456:AA...) must not trip it, so
        # each pattern requires enough real entropy to be a genuine key.
        run: |
          set -o pipefail
          # Delegates to scripts/scan_secrets.sh, which the .githooks/pre-commit
          # hook also calls. One pattern list, two callers — an inline copy here
          # is how CI and the local hook drift until one of them is the only
          # thing still checking.
          ./scripts/scan_secrets.sh

      - name: No real env file is tracked
        # The scan above catches a credential pasted into a source file. This
        # catches the other direction: a whole populated env contract committed
        # by name. Only `.example` variants belong in git.
        run: |
          set -o pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::a real env file is tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "clean"

  placeholder-hygiene:
    # The 2026-09-03 incident, as a CI job. The `secrets` job above looks for a
    # REAL key being committed; this looks for the inverse failure that actually
    # happened — a FAKE key being deployed. CI cannot see the remote box, so it
    # enforces the two halves it can reach: the code guard that refuses to serve
    # with a placeholder, and the installer gate that refuses to deploy one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The example placeholder must be rejected by the guard
        # Deliberately asserts behaviour, not the presence of a file: someone
        # can delete or weaken core/secret_hygiene.py and this still fails.
        run: |
          python - <<'PY'
          import re, sys, pathlib
          sys.path.insert(0, ".")
          from core.secret_hygiene import weak_token_reason

          failures = []
          for example in pathlib.Path(".").glob(".env*.example"):
              for line in example.read_text().splitlines():
                  m = re.match(r"^TRADING_AGENT_TOKEN=(.+)$", line.strip())
                  if m and weak_token_reason(m.group(1).strip()) is None:
                      failures.append(f"{example.name}: token would be ACCEPTED in production")
          if failures:
              print("::error::" + "; ".join(failures))
              sys.exit(1)
          print("every committed placeholder is rejected by the startup guard")
          PY

      - name: The installer must refuse to deploy a placeholder
        run: |
          set -o pipefail
          if ! grep -q "MUST_DIFFER_FROM_EXAMPLE" deploy/install.sh; then
            echo "::error::deploy/install.sh lost its placeholder gate"
            exit 1
          fi
          bash -n deploy/install.sh
          echo "installer gate present and syntactically valid"
