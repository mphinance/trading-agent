name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The deployable range. This comment used to say the SDK pins <3.14 —
        # that was true of an older SDK. 2.0.16 declares
        # python_requires='>=3.8,<3.15' with explicit cryptography/grpcio pins
        # for 3.14, so 3.14 is supported and is the end most likely to break
        # first. venus runs 3.10. Testing both ends catches stdlib drift in
        # between; the SDK itself is stubbed here, so this is about THIS code.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately NOT requirements.txt. Two of its entries are stubbed in
        # tests/conftest.py and installing them would make CI about them rather
        # than about this code:
        #   webull-openapi-python-sdk  pulls paho-mqtt, which needs a compiler
        #                              on some Pythons and pins python <3.14
        #   claude-agent-sdk           shells out to a `claude` binary that only
        #                              ships via npm, so importing proves nothing
        # Everything the suite exercises is reachable without either.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Byte-compile every module
        # Catches a syntax error in a file no test imports (wb.py is stubbed
        # away from the suite's import graph).
        run: python -m compileall -q .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree for credential-shaped strings
        # Rule 2 keeps secrets in the parent directory so they cannot be
        # committed by construction, and rule 5 assumes everything here ends up
        # on video. This is the backstop for a paste that slipped through.
        # Placeholders in docs (sk-ant-..., 123456:AA...) must not trip it, so
        # each pattern requires enough real entropy to be a genuine key.
        run: |
          set -o pipefail
          if grep -rInE \
               -e 'sk-ant-[A-Za-z0-9_-]{20,}' \
               -e 'td_live_[A-Za-z0-9_-]{20,}' \
               -e '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' \
               --exclude-dir=.git --exclude-dir=.venv . ; then
            echo "::error::credential-shaped string committed"
            exit 1
          fi
          echo "clean"
