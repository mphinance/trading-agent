name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Webull SDK pins python >=3.8,<3.14, so that is the range sidecar
        # can actually be deployed on. venus runs 3.10; 3.13 is the ceiling.
        # Testing both ends catches syntax and stdlib drift in between.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately NOT requirements.txt. Two of its entries are stubbed in
        # tests/conftest.py and installing them would make CI about them rather
        # than about this code:
        #   webull-openapi-python-sdk  pulls paho-mqtt, which needs a compiler
        #                              on some Pythons and pins python <3.14
        #   claude-agent-sdk           shells out to a `claude` binary that only
        #                              ships via npm, so importing proves nothing
        # Everything the suite exercises is reachable without either.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Byte-compile every module
        # Catches a syntax error in a file no test imports (wb.py and chat.py
        # are stubbed away from the suite's import graph).
        run: python -m compileall -q .

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the single-page UI
        # There is no bundler, so this is the only thing standing between a typo
        # in static/index.html and a blank panel. Runs with node present so the
        # `node --check` test is not skipped.
        run: pytest tests/test_static.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree for credential-shaped strings
        # Rule 2 keeps secrets in the parent directory so they cannot be
        # committed by construction, and rule 5 assumes everything here ends up
        # on video. This is the backstop for a paste that slipped through.
        # Placeholders in docs (sk-ant-..., 123456:AA...) must not trip it, so
        # each pattern requires enough real entropy to be a genuine key.
        run: |
          set -o pipefail
          if grep -rInE \
               -e 'sk-ant-[A-Za-z0-9_-]{20,}' \
               -e 'td_live_[A-Za-z0-9_-]{20,}' \
               -e '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' \
               --exclude-dir=.git --exclude-dir=.venv . ; then
            echo "::error::credential-shaped string committed"
            exit 1
          fi
          echo "clean"
