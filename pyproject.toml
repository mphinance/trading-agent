[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.0.1"
description = "Portable Hermes trading-agent setup CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[project.optional-dependencies]
keyring = ["keyring>=24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "python-dotenv>=1.2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

# One source of truth at the repo root (so `hermes profile install` works from a checkout or repo URL),
# shipped inside the wheel where trading_agent.paths looks for it.
[tool.hatch.build.targets.wheel.force-include]
"distribution.yaml" = "trading_agent/data/distribution/distribution.yaml"
"SOUL.md" = "trading_agent/data/distribution/SOUL.md"
"config.yaml" = "trading_agent/data/distribution/config.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["error"]
markers = ["integration: needs external data (set AWESOME_BROKER_MCP)"]
